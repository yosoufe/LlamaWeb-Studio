version: '3.8'

services:
  llama-cpp:
    image: ghcr.io/yosoufe/llama.cpp:server-cuda12.4
    container_name: llama-cpp-backend
    restart: unless-stopped
    ports:
      - "10000:10000"
    volumes:
      - ./models:/models
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=10000
      - LLAMA_ARG_MODELS_DIR=/models
      - LLAMA_ARG_MODELS_AUTOLOAD=1
      - LD_LIBRARY_PATH=/app:/usr/local/lib
    command: ["--no-warmup", "--sleep-idle-seconds", "3600"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  hf-downloader-ui:
    build: .
    container_name: hf-downloader-ui
    ports:
      - "5173:5173"
    volumes:
      - ./models:/models
      - ./backend/app:/app/app
    environment:
      - MODELS_DIR=/models
      - HF_TOKEN=${HF_TOKEN:-}
      - LLAMA_CPP_SERVER_URL=http://lama-cpp:10000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # During dev, we still use --reload for backend changes
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5173", "--reload"]
    restart: unless-stopped
    depends_on:
      - llama-cpp
