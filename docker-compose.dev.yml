version: '3.8'

services:
  hf-downloader-ui:
    build: .
    container_name: hf-downloader-ui
    ports:
      - "5173:5173"
    volumes:
      - ./models:/models
      - ./backend/app:/app/app
    environment:
      - MODELS_DIR=/models
      - HF_TOKEN=${HF_TOKEN:-}
    # During dev, we still use --reload for backend changes
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "5173", "--reload"]
    restart: unless-stopped
