version: '3.8'

services:
  backend:
    image: ghcr.io/yosoufe/llamaweb-studio-backend:latest
    container_name: llamaweb-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - MODELS_DIR=/models
    restart: unless-stopped

  frontend:
    image: ghcr.io/yosoufe/llamaweb-studio-frontend:latest
    container_name: llamaweb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
