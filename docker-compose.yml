version: '3.8'

services:
  backend:
    image: ghcr.io/yosoufe/llamaweb-studio-backend:latest
    container_name: llamaweb-backend
    ports:
      - "8000:8000"
      # Expose a range of ports for the spawned model servers
      - "8001-8010:8001-8010"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - MODELS_DIR=/models
      - HOST_IP=0.0.0.0
    restart: unless-stopped

  frontend:
    image: ghcr.io/yosoufe/llamaweb-studio-frontend:latest
    container_name: llamaweb-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
