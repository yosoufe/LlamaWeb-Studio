version: '3.8'

services:
  backend:
    build: .
    container_name: llamaweb-backend
    ports:
      - "8000:8000"
      # Expose a range of ports for the spawned model servers
      - "8001-8010:8001-8010"
    volumes:
      - ./models:/models
      # Mount the app directory for easier development (optional, but good for hot reload if we used --reload)
      - ./backend/app:/app/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - MODELS_DIR=/models
      - HOST_IP=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: llamaweb-frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reload during development
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    depends_on:
      - backend
    restart: unless-stopped
