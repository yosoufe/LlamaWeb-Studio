version: '3.8'

services:
  hf-downloader-ui:
    image: ghcr.io/yosoufe/hf-downloader-ui:latest
    container_name: hf-downloader-ui
    ports:
      - "5173:5173"
    volumes:
      - ./models:/models
    environment:
      - MODELS_DIR=/models
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
